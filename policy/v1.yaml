# policy/v1.yaml — authored by hand from docs/SCORING_AND_POLICY.md §8.
# Owner: TM1. If you change any weight or threshold, re-run §9's worked
# example and update that document in the same commit.
version: "1.1.0"
signed_by: "TM1"

weights:
  s1_self_report: 0.35
  s2_linguistic:  0.25
  s3_case_context: 0.25
  s4_engagement:  0.15
  # DELIBERATE ZERO — NOT AN UNFINISHED TODO. Do not "complete" this.
  # docs/SCORING_AND_POLICY.md section 2: acoustic emotion inference is least
  # accurate for exactly the callers this system exists for — regional accents,
  # code-switching, poor line quality, distress registers under-represented in
  # every training set. Weighting it would push the largest errors onto the most
  # marginalised users. S5 is therefore extracted and displayed with a caveat,
  # and contributes nothing to the composite.
  # The matching comment on the S5 extractor lands with lib/scoring on Day 2.
  s5_acoustic:    0.00

baseline:
  ewma_lambda: 0.3
  sigma_floor: 8
  change_point_z: 2.0
  min_history_for_change_point: 2

tiers:
  # evaluated top to bottom, first match wins
  - tier: RED
    any_of:
      - change_point: true
      - composite_gte: 70
      - s3_gte: 60
  - tier: AMBER
    any_of:
      - composite_gte: 45
      - z_gte: 1.2
      # DORMANT, AND CORRECT ANYWAY. `composite_gte: 45` sits above this in the
      # same any_of, and every composite >= 60 is also >= 45, so the clause
      # above always matches first and this one can never be the rule named in
      # `assignTier`'s matchedRule. The OUTCOME is still right — section 7's
      # floor says a first contact at composite >= 60 gets "at least Amber",
      # and it does — so this is not a bug and must not be deleted as dead
      # config. It goes live the moment `composite_gte` is tuned above 60 on
      # Day 3 (section 10), which is exactly when the floor starts mattering.
      # lib/policy/policy.test.ts asserts both halves of this.
      - first_contact_composite_gte: 60
      - missed_checkins_gte: 3
  - tier: GREEN
    default: true

floors:
  model_may_lower_tier: false
  critical_requires_deterministic_trigger: true

escalation:
  CRITICAL: { ack_required: true,  sla_minutes: 0,     immediate_resources: true }
  RED:      { ack_required: true,  sla_minutes: 30 }
  AMBER:    { ack_required: false, sla_minutes: 1440 }
  GREEN:    { ack_required: false, sla_minutes: 10080 }   # 7 days
